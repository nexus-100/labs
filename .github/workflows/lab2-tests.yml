name: Lab2 tests

on:
  push:
    paths:
      - "lab2/**"
      - ".github/workflows/lab2-tests.yml"
  pull_request:
    paths:
      - "lab2/**"
      - ".github/workflows/lab2-tests.yml"
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and quality tools
        run: python -m pip install -r requirements.txt pycodestyle coverage
      - name: Check PEP 8 style
        run: pycodestyle --max-line-length=79 app.py coordinates.py sources.py tests
      - name: Run unit tests with coverage
        run: |
          coverage run --source=app,coordinates,sources -m unittest discover -v
          coverage report --fail-under=85
